[config]
prefer = "value"

[config.wallpaper]
command = "awww img --transition-type wipe {{ image }}"
set = true

# ----------------------------------------------------
#  WINDOW MANAGER & COMPOSITORS
# ----------------------------------------------------
[templates.hyprland]
input_path = '/home/wesii/.config/matugen/templates/hyprland.conf'
output_path = '/home/wesii/.config/hypr/colors.conf'

[templates.waybar]
input_path = '/home/wesii/.config/matugen/templates/waybar.css'
output_path = '/home/wesii/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar || true'

[templates.wofi]
input_path = '/home/wesii/.config/matugen/templates/wofi.css'
output_path = '/home/wesii/.config/wofi/colors.css'

# ----------------------------------------------------
#  THEME ENGINES & GRAPHICS (GTK / QT )
# ----------------------------------------------------
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.themes/adw-gtk3-dark/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.themes/adw-gtk3-dark/gtk-4.0/colors.css"
post_hook = 'bash ~/.config/matugen/gtk-reload.sh'

[templates.qt5ct]
input_path = '/home/wesii/.config/matugen/templates/qt.conf'
output_path = '/home/wesii/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '/home/wesii/.config/matugen/templates/qt.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kvantum_kvconfig]
input_path = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'


# ----------------------------------------------------
#  TERMINALS & SHELLS
# ----------------------------------------------------
[templates.ghostty]
input_path = '/home/wesii/.config/matugen/templates/ghostty'
output_path = '/home/wesii/.config/ghostty/themes/Matugen'
post_hook = 'pkill -SIGUSR2 ghostty || true'

[templates.alacritty]
input_path = '/home/wesii/.config/matugen/templates/alacritty.toml'
output_path = '/home/wesii/.config/alacritty/colors.toml'

[templates.kitty]
input_path = '/home/wesii/.config/matugen/templates/kitty.conf'
output_path = '/home/wesii/.config/kitty/themes/Matugen.conf'
post_hook = 'pkill -SIGUSR1 kitty || true'
# ----------------------------------------------------
#  EDITORS & UTILITIES
# ----------------------------------------------------
[templates.nvim]
input_path = '/home/wesii/.config/matugen/templates/nvim.vim'
output_path = '/home/wesii/.config/nvim/colors/matugen.vim'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.vscodium]
input_path = '/home/wesii/.config/matugen/templates/vscodium.json'
output_path = '/home/wesii/.cache/matugen/vscode-colors.json'

[templates.dunst]
input_path = '/home/wesii/.config/matugen/templates/dunstrc'
output_path = '/home/wesii/.config/dunst/dunstrc'
post_hook = 'dunstctl reload || true'

[templates.wlogout]
input_path = '/home/wesii/.config/matugen/templates/wlogout.css'
output_path = '/home/wesii/.config/wlogout/colors.css'

# ----------------------------------------------------
#  MEDIA & SYSTEM MONITORING
# ----------------------------------------------------
[templates.btop]
input_path = '/home/wesii/.config/matugen/templates/btop.theme'
output_path = '/home/wesii/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.cava]
input_path = '/home/wesii/.config/matugen/templates/cava.ini'
output_path = '/home/wesii/.config/cava/themes/matugen'
post_hook = 'pkill -USR1 cava || true'

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.opencode]
input_path = '~/.config/matugen/templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell.json'
output_path = '~/.config/quickshell/generated/colors.json'
post_hook = 'quickshell kill >/dev/null 2>&1 || true; qs -d >/dev/null 2>&1'
