# Basics
bindsym $mod+Return exec $term
bindsym $mod+t exec alacritty
bindsym $mod+q kill
bindsym $mod+Space exec $menu
bindsym $mod+r exec $menu
bindsym $mod+Ctrl+r exec ~/.config/sway/scripts/reload-config.sh
bindsym $mod+Shift+e exec swaynag -t warning -m 'Do you really want to exit SwayFX?' -B 'Yes, exit SwayFX' 'swaymsg exit'

# Config editing
bindsym $mod+Ctrl+c exec codium --new-window  ~/msc

# Wallpaper picker
bindsym $mod+Ctrl+w exec kitty --class wallpaper-picker -e ~/.config/sway/scripts/wallpaper-switcher.sh

# Clipboard manager
bindsym $mod+c exec ~/.config/sway/scripts/clipboard.sh

# Apps & Utilities
bindsym $mod+e exec $fileManager
bindsym $mod+Alt+e exec kitty --app-id=yazi --class=yazi -e yazi
bindsym $mod+m exec kitty --app-id=btop --class=btop -e btop
bindsym $mod+b exec $browser
bindsym $mod+d exec codium
bindsym $mod+Alt+w exec brave --app=https://web.whatsapp.com
bindsym $mod+Alt+g exec brave --app=https://gemini.google.com
bindsym $mod+Alt+p exec brave --app=https://www.perplexity.ai
bindsym $mod+Alt+c exec brave --app=https://chatgpt.com
bindsym $mod+Alt+a exec brave --app=https://claude.ai
bindsym $mod+i exec subl --launch-or-new-window

# Floating 
bindsym $mod+v exec ~/.config/sway/scripts/toggle-floating.sh
bindsym $mod+Ctrl+Space focus mode_toggle
bindsym $mod+f fullscreen
bindsym $mod+Ctrl+h splith
bindsym $mod+Ctrl+v splitv


# Lock & Logout
bindsym $mod+Shift+l exec hyprlock
bindsym $mod+Shift+q exec wlogout -p layer-shell

# Theme toggle
bindsym $mod+Ctrl+l exec ~/.config/sway/scripts/light-mode.sh

# Additional keybindings (hyprland parity)
# Note: Sway doesn't have traditional "maximize" (fill screen keeping decorations)
# Tiled windows already fill their container; floating windows can use Super+f for fullscreen
# bindsym $mod+Ctrl+f fullscreen
bindsym $mod+Ctrl+p exec hyprpicker -a -f hex

# UI Toggles & Scripts
bindsym $mod+Shift+b exec ~/.config/sway/scripts/toggle-waybar.sh
bindsym $mod+Ctrl+b exec ~/.config/sway/scripts/toggle-blur.sh
bindsym $mod+period exec wofi-emoji
bindsym $mod+o exec ~/.config/sway/scripts/centered-floating-window.sh
bindsym $mod+h exec kitty --app-id=sway_help --class=sway_help -e ~/.config/sway/scripts/help.sh
bindsym $mod+n exec swaync-client -t -sw
bindsym $mod+Shift+n exec swaync-client -d -sw


# Quick toggles (Super+Ctrl+1/2)
bindsym $mod+Ctrl+1 exec ~/.config/sway/scripts/toggle-caffeine.sh
bindsym $mod+Ctrl+2 exec ~/.config/sway/scripts/toggle-gamemode.sh

# Moving around
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Screenshots
bindsym Print exec grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Screenshot saved!" -a "grim" -t 3000
bindsym $mod+Shift+s exec grim -g "$(slurp)" - | wl-copy
bindsym $mod+Ctrl+s exec grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Screenshot saved!" -a "grim" -t 3000

# Media / Volume / Brightness
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_SOURCE@ toggle
bindsym --locked XF86MonBrightnessDown exec ~/.config/sway/scripts/brightness.sh down
bindsym --locked XF86MonBrightnessUp exec ~/.config/sway/scripts/brightness.sh up
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioStop exec playerctl stop

# Zoom / magnifier (wooz)
bindsym $mod+z exec wooz --zoom-in 25% --mouse-track --invert-scroll

# Resize mode
mode "resize" {
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+Alt+r mode "resize"

# Scratchpad (kitty dropdown) - toggle with Super+Alt+Return
bindsym $mod+Alt+Return exec ~/.config/sway/scripts/scratchpad-toggle.sh

# Workspace navigation
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev
bindgesture swipe:3:left workspace next
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:up exec $menu

bindsym --whole-window $mod+button4 workspace next
bindsym --whole-window $mod+button5 workspace prev   