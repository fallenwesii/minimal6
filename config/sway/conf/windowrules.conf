# Window rules for SwayFX
# Ported from hyprland config

# --- Systemwide blur --------------------------------------------------
# swayfx only draws blur behind windows with opacity < 1, so a global
# sub-1.0 opacity turns blur on for every app. Terminals are exempted
# (they keep opacity 1 and blur via their own background_opacity, so the
# toggle never affects them).
# Edit the ON opacity below to taste (whiter wallpapers may want values );
# toggle-blur.sh remembers your last value via the marker line below.
# blur-preferred-opacity: 0.76
for_window [class=".*"] opacity 0.76
for_window [app_id=".*"] opacity 0.76
for_window [class="(?i)(kitty|alacritty|ghostty|quick-settings|sway_help|hypr_help|yazi|btop)"] opacity 1
for_window [app_id="(?i)(kitty|alacritty|ghostty|quick-settings|sway_help|hypr_help|yazi|btop)"] opacity 1
# ----------------------------------------------------------------------


for_window [app_id="wallpaper-picker"] floating enable
for_window [app_id="wallpaper-picker"] border none
for_window [app_id="wallpaper-picker"] move position center
for_window [app_id="wallpaper-picker"] resize set width 1100 px height 300 px

for_window [app_id="live-wallpaper-picker"] floating enable
for_window [app_id="live-wallpaper-picker"] border none
for_window [app_id="live-wallpaper-picker"] move position center
for_window [app_id="live-wallpaper-picker"] resize set width 1100 px height 300 px



for_window [app_id="sway_help"] floating enable
